<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>星图 · THE ATLAS</title>
<link rel="icon" href="/favicon.ico">
<script src="/fx/theme-boot.js"></script>
<link rel="stylesheet" href="/fx/site.css">
<link rel="stylesheet" href="/fx/lab.css">
</head>
<body class="lab">
<div class="lab-wrap">

  <a class="lab-back" href="/">← 回到地面</a>

  <header class="lab-head">
    <div class="lab-kicker">HIDDEN PAGE 03 · THE ATLAS</div>
    <h1>天花板上的<em>第七颗</em></h1>
    <p>把六颗星连起来，是一句话的形状。但图上有第七颗，
      又小又偏，像谁多画了一笔。点它一下试试。</p>
  </header>

  <section class="lab-card">
    <h2><span class="lab-no">01 / MAP</span>星图</h2>
    <p>亮起来的是你已拾回的碎纸，暗着的是还没找到的。线索会写在下面。</p>
    <div class="atlas-map" id="atlas-map">
      <p style="padding:24px;color:var(--hj-muted);font-size:13px">星图需要 JavaScript 才能点亮。</p>
    </div>
    <div class="atlas-info" id="atlas-info">点一颗星，看看它说什么。</div>
  </section>

  <section class="lab-card">
    <h2><span class="lab-no">02 / THEMES</span>世界陈列</h2>
    <p>这里也是换主题的另一个入口。五种，四种随时可用，第五种要六片碎纸。</p>
    <div class="theme-grid" id="theme-grid"></div>
  </section>

  <div class="lab-foot">
    <span>THE ATLAS · 主题永久存在 cookie 里</span>
    <a href="/seventh/">门在那边 →</a>
  </div>

</div>
<script src="/fx/site.js"></script>
<script src="/fx/lab.js"></script>
</body>
</html>
