<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050d"/>
      <stop offset="0.38" stop-color="#0a1526"/>
      <stop offset="0.68" stop-color="#15304a"/>
      <stop offset="0.86" stop-color="#1d3a55"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.98"/>
      <stop offset="0.28" stop-color="#ffeeb5" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#ffd98a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonPink">
      <stop offset="0" stop-color="#ff3d94" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3d94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonCyan">
      <stop offset="0" stop-color="#31e6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#31e6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="bldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101f31"/><stop offset="1" stop-color="#060c15"/>
    </linearGradient>
    <linearGradient id="bldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16283e"/><stop offset="1" stop-color="#080f1a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 星点 -->
  <g fill="#cfe9ff" opacity="0.55">
    <circle cx="120" cy="90" r="1.4"/><circle cx="260" cy="52" r="1"/><circle cx="420" cy="128" r="1.2"/>
    <circle cx="560" cy="60" r="1"/><circle cx="700" cy="150" r="1.3"/><circle cx="980" cy="70" r="1.1"/>
    <circle cx="1150" cy="130" r="1.4"/><circle cx="1320" cy="60" r="1"/><circle cx="1470" cy="150" r="1.2"/>
    <circle cx="180" cy="200" r="1"/><circle cx="620" cy="230" r="1.1"/><circle cx="1240" cy="210" r="1"/>
  </g>

  <!-- 月亮 -->
  <circle cx="1265" cy="190" r="230" fill="url(#moonGlow)"/>
  <circle cx="1265" cy="190" r="62" fill="#fffbe8"/>
  <circle cx="1243" cy="172" r="9" fill="#f0e3bd" opacity="0.7"/>
  <circle cx="1285" cy="205" r="12" fill="#f0e3bd" opacity="0.55"/>
  <circle cx="1272" cy="160" r="6" fill="#f0e3bd" opacity="0.5"/>

  <!-- 霓虹光团 -->
  <ellipse cx="300" cy="430" rx="260" ry="190" fill="url(#neonPink)"/>
  <ellipse cx="880" cy="470" rx="300" ry="200" fill="url(#neonCyan)"/>
  <ellipse cx="1450" cy="500" rx="240" ry="180" fill="url(#neonPink)"/>

  <!-- 远景楼群 -->
  <g fill="#0a1421" opacity="0.9">
    <rect x="0" y="430" width="120" height="300"/><rect x="130" y="470" width="90" height="260"/>
    <rect x="240" y="400" width="70" height="330"/><rect x="330" y="500" width="110" height="230"/>
    <rect x="460" y="450" width="80" height="280"/><rect x="560" y="512" width="70" height="218"/>
    <rect x="650" y="430" width="120" height="300"/><rect x="790" y="480" width="90" height="250"/>
    <rect x="900" y="415" width="100" height="315"/><rect x="1020" y="495" width="90" height="235"/>
    <rect x="1130" y="455" width="120" height="275"/><rect x="1270" y="500" width="90" height="230"/>
    <rect x="1380" y="430" width="120" height="300"/><rect x="1510" y="470" width="90" height="260"/>
  </g>

  <!-- 近景主楼 -->
  <g fill="url(#bldA)">
    <rect x="60" y="330" width="210" height="400" rx="4"/>
    <rect x="1210" y="300" width="240" height="430" rx="4"/>
    <rect x="900" y="380" width="150" height="350" rx="4"/>
  </g>
  <g fill="url(#bldB)">
    <rect x="300" y="380" width="180" height="350" rx="4"/>
    <rect x="1050" y="360" width="140" height="370" rx="4"/>
  </g>

  <!-- 楼宇窗户（部分亮灯） -->
  <g fill="#ffd98a" opacity="0.85">
    <rect x="88" y="360" width="16" height="20"/><rect x="124" y="360" width="16" height="20"/>
    <rect x="196" y="404" width="16" height="20"/><rect x="88" y="452" width="16" height="20"/>
    <rect x="160" y="500" width="16" height="20"/><rect x="232" y="548" width="16" height="20"/>
    <rect x="124" y="596" width="16" height="20"/><rect x="196" y="644" width="16" height="20"/>
    <rect x="330" y="410" width="14" height="18"/><rect x="380" y="458" width="14" height="18"/>
    <rect x="430" y="506" width="14" height="18"/><rect x="330" y="602" width="14" height="18"/>
    <rect x="1240" y="336" width="18" height="22"/><rect x="1290" y="384" width="18" height="22"/>
    <rect x="1380" y="432" width="18" height="22"/><rect x="1240" y="480" width="18" height="22"/>
    <rect x="1330" y="576" width="18" height="22"/><rect x="1400" y="672" width="18" height="22"/>
    <rect x="930" y="410" width="14" height="18"/><rect x="980" y="470" width="14" height="18"/>
    <rect x="1010" y="560" width="14" height="18"/><rect x="1080" y="392" width="14" height="18"/>
  </g>
  <g fill="#7fd9ff" opacity="0.55">
    <rect x="124" y="404" width="16" height="20"/><rect x="232" y="360" width="16" height="20"/>
    <rect x="88" y="548" width="16" height="20"/><rect x="160" y="644" width="16" height="20"/>
    <rect x="380" y="506" width="14" height="18"/><rect x="430" y="602" width="14" height="18"/>
    <rect x="1290" y="432" width="18" height="22"/><rect x="1380" y="528" width="18" height="22"/>
    <rect x="1330" y="336" width="18" height="22"/><rect x="1110" y="430" width="14" height="18"/>
  </g>

  <!-- 街面 -->
  <rect x="0" y="726" width="1600" height="174" fill="url(#road)"/>
  <rect x="0" y="726" width="1600" height="3" fill="#2a4a68" opacity="0.7"/>

  <!-- 湿地反光 -->
  <g opacity="0.5">
    <rect x="1265" y="730" width="46" height="150" fill="#ffeeb5" opacity="0.42"/>
    <rect x="300" y="730" width="30" height="120" fill="#ff3d94" opacity="0.3"/>
    <rect x="880" y="730" width="34" height="140" fill="#31e6ff" opacity="0.3"/>
    <rect x="1450" y="730" width="26" height="130" fill="#ff3d94" opacity="0.22"/>
  </g>
  <g stroke="#8fd0ff" stroke-width="1.2" opacity="0.18">
    <path d="M0 780 H1600"/><path d="M0 820 H1600"/><path d="M0 862 H1600"/>
  </g>

  <!-- 路灯光锥 -->
  <g opacity="0.22">
    <polygon points="1120,600 1160,600 1240,906 980,906" fill="#ffe3a1"/>
    <polygon points="180,620 214,620 280,906 60,906" fill="#cde6ff"/>
  </g>

  <!-- 雨丝（静态底纹，动态雨滴由 canvas 叠加） -->
  <g stroke="#bfe3ff" stroke-width="1" opacity="0.14">
    <path d="M100 120 l-18 90"/><path d="M240 300 l-18 90"/><path d="M380 60 l-18 90"/>
    <path d="M520 240 l-18 90"/><path d="M660 420 l-18 90"/><path d="M800 160 l-18 90"/>
    <path d="M940 360 l-18 90"/><path d="M1080 100 l-18 90"/><path d="M1220 480 l-18 90"/>
    <path d="M1360 260 l-18 90"/><path d="M1500 540 l-18 90"/><path d="M60 620 l-18 90"/>
    <path d="M1720 400 l-18 90"/>
  </g>

  <!-- 前景暗角 -->
  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.78">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
