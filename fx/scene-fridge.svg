<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cavity" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#dff2ff"/>
      <stop offset="0.35" stop-color="#a9d8f2"/>
      <stop offset="0.72" stop-color="#6fb3d6"/>
      <stop offset="1" stop-color="#2c5f80"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#cbe7f8"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#eaf7ff"/><stop offset="1" stop-color="#b3d9ee"/>
    </linearGradient>
    <radialGradient id="moonCore">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fdfbe8"/>
      <stop offset="1" stop-color="#e8f0d8"/>
    </radialGradient>
    <radialGradient id="moonHalo">
      <stop offset="0" stop-color="#f3ffe6" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#d9f7ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#bfeaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d6eefb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fc4dd" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe3ee"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9fbff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#b8e4f5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8fc9e2" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="coldLight" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#d8f0ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d8f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#0b2c40" stop-opacity="0"/>
      <stop offset="1" stop-color="#06202f" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- 冰箱内腔 -->
  <rect width="1600" height="900" fill="url(#cavity)"/>
  <rect width="1600" height="900" fill="url(#coldLight)"/>

  <!-- 侧壁与门框 -->
  <rect x="0" y="0" width="150" height="900" fill="url(#wallL)"/>
  <rect x="1450" y="0" width="150" height="900" fill="url(#wallR)"/>
  <rect x="146" y="0" width="8" height="900" fill="#9fc9dd" opacity="0.55"/>
  <rect x="1446" y="0" width="8" height="900" fill="#9fc9dd" opacity="0.55"/>

  <!-- 顶部冷光灯条 -->
  <rect x="230" y="40" width="1140" height="16" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="230" y="40" width="1140" height="16" rx="8" fill="#ffffff" filter="url(#soft)" opacity="0.8"/>
  <rect x="230" y="56" width="1140" height="90" fill="#ffffff" opacity="0.12" filter="url(#soft)"/>

  <!-- 层架 -->
  <g>
    <rect x="190" y="300" width="1220" height="10" rx="5" fill="url(#shelf)"/>
    <rect x="190" y="520" width="1220" height="10" rx="5" fill="url(#shelf)"/>
    <rect x="190" y="740" width="1220" height="10" rx="5" fill="url(#shelf)"/>
    <g stroke="#ffffff" stroke-width="1" opacity="0.35">
      <path d="M240 300 V310"/><path d="M400 300 V310"/><path d="M560 300 V310"/><path d="M720 300 V310"/>
      <path d="M880 300 V310"/><path d="M1040 300 V310"/><path d="M1200 300 V310"/><path d="M1360 300 V310"/>
      <path d="M240 520 V530"/><path d="M400 520 V530"/><path d="M560 520 V530"/><path d="M720 520 V530"/>
      <path d="M880 520 V530"/><path d="M1040 520 V530"/><path d="M1200 520 V530"/><path d="M1360 520 V530"/>
    </g>
  </g>

  <!-- 第一层：牛奶盒 -->
  <g>
    <path d="M300 150 h96 l26 40 v110 h-148 v-110 z" fill="url(#milk)" opacity="0.95"/>
    <path d="M300 150 l48 -34 h48 l-48 34 z" fill="#ffffff" opacity="0.9"/>
    <path d="M348 116 l48 34 h-48 z" fill="#dbeaf2" opacity="0.9"/>
    <rect x="276" y="240" width="148" height="14" fill="#7fb4cd" opacity="0.7"/>
    <text x="350" y="252" font-family="Georgia,serif" font-size="11" fill="#3d6d84" text-anchor="middle" letter-spacing="3">MILK</text>
    <rect x="300" y="176" width="30" height="46" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- 第一层：玻璃罐 -->
  <g>
    <rect x="470" y="182" width="104" height="118" rx="10" fill="url(#jar)"/>
    <rect x="462" y="162" width="120" height="24" rx="10" fill="#e9fbff" opacity="0.85"/>
    <rect x="486" y="212" width="72" height="70" fill="#a8dcf0" opacity="0.45"/>
    <path d="M474 196 v86" stroke="#ffffff" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- 第二层：鸡蛋托 + 一颗月亮 -->
  <g opacity="0.9">
    <rect x="250" y="430" width="230" height="88" rx="12" fill="#dceef8" opacity="0.75"/>
    <g fill="#fdfefe" opacity="0.95">
      <ellipse cx="288" cy="452" rx="24" ry="19"/><ellipse cx="344" cy="452" rx="24" ry="19"/>
      <ellipse cx="400" cy="452" rx="24" ry="19"/><ellipse cx="456" cy="452" rx="24" ry="19"/>
      <ellipse cx="316" cy="486" rx="22" ry="17"/><ellipse cx="372" cy="486" rx="22" ry="17"/>
      <ellipse cx="428" cy="486" rx="22" ry="17"/>
    </g>
  </g>

  <!-- 月亮本体（冰箱里那盏灯） -->
  <circle cx="1010" cy="420" r="300" fill="url(#moonHalo)"/>
  <circle cx="1010" cy="420" r="106" fill="url(#moonCore)"/>
  <circle cx="978" cy="392" r="14" fill="#e6ecd2" opacity="0.75"/>
  <circle cx="1042" cy="444" r="20" fill="#e6ecd2" opacity="0.6"/>
  <circle cx="1022" cy="376" r="9" fill="#e6ecd2" opacity="0.55"/>
  <circle cx="1002" cy="470" r="7" fill="#e6ecd2" opacity="0.5"/>
  <ellipse cx="1010" cy="530" rx="150" ry="16" fill="#bdeaff" opacity="0.25"/>

  <!-- 月亮下方玻璃架上的倒影 -->
  <ellipse cx="1010" cy="534" rx="120" ry="12" fill="#e8fbff" opacity="0.5" filter="url(#soft2)"/>

  <!-- 第三层：抽屉与蔬菜 -->
  <g>
    <rect x="240" y="640" width="330" height="96" rx="14" fill="#cfeaf8" opacity="0.55"/>
    <path d="M240 700 h330" stroke="#8fc4dd" stroke-width="2" opacity="0.6"/>
    <rect x="258" y="666" width="14" height="26" rx="7" fill="#9ecfc0" opacity="0.8"/>
    <rect x="282" y="660" width="14" height="32" rx="7" fill="#8fc7b6" opacity="0.8"/>
    <rect x="306" y="668" width="14" height="24" rx="7" fill="#aad6c7" opacity="0.8"/>
  </g>

  <!-- 霜花（四角） -->
  <g stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M60 80 l60 40 M60 80 l40 60 M60 80 l78 6 M60 80 l-4 78"/>
    <path d="M1540 80 l-60 40 M1540 80 l-40 60 M1540 80 l-78 6 M1540 80 l4 78"/>
    <path d="M60 820 l60 -40 M60 820 l40 -60 M60 820 l78 -6 M60 820 l-4 -78"/>
    <path d="M1540 820 l-60 -40 M1540 820 l-40 -60 M1540 820 l-78 -6 M1540 820 l4 -78"/>
  </g>
  <g fill="#ffffff" opacity="0.35">
    <circle cx="240" cy="380" r="3"/><circle cx="1290" cy="360" r="2.6"/><circle cx="700" cy="620" r="2.4"/>
    <circle cx="380" cy="600" r="2.2"/><circle cx="1180" cy="640" r="3"/><circle cx="860" cy="200" r="2.5"/>
    <circle cx="1420" cy="480" r="2.2"/><circle cx="200" cy="240" r="2.8"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig2)"/>
</svg>
