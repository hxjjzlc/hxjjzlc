<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="0.35" stop-color="#0d1f3d"/>
      <stop offset="0.62" stop-color="#1b3a5e"/>
      <stop offset="0.82" stop-color="#2f5f80"/>
      <stop offset="1" stop-color="#0e1c2c"/>
    </linearGradient>
    <radialGradient id="nhalo">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#dff0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f4ff"/><stop offset="0.5" stop-color="#c9dff2"/><stop offset="1" stop-color="#8fb4cf"/>
    </linearGradient>
    <radialGradient id="warmWin">
      <stop offset="0" stop-color="#ffe9b0"/><stop offset="0.6" stop-color="#ffc46b"/><stop offset="1" stop-color="#e08b32"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#nsky)"/>

  <!-- 星星 -->
  <g fill="#eaf6ff" opacity="0.65">
    <circle cx="140" cy="70" r="1.5"/><circle cx="300" cy="130" r="1"/><circle cx="470" cy="60" r="1.3"/>
    <circle cx="620" cy="160" r="1"/><circle cx="770" cy="80" r="1.2"/><circle cx="920" cy="150" r="1"/>
    <circle cx="1120" cy="70" r="1.4"/><circle cx="1290" cy="140" r="1"/><circle cx="1450" cy="90" r="1.2"/>
    <circle cx="220" cy="220" r="1"/><circle cx="700" cy="250" r="1.1"/><circle cx="1360" cy="240" r="1"/>
  </g>

  <!-- 月亮 -->
  <circle cx="1150" cy="230" r="260" fill="url(#nhalo)"/>
  <circle cx="1150" cy="230" r="74" fill="#fdfff5"/>
  <circle cx="1126" cy="208" r="10" fill="#e8eed6" opacity="0.65"/>
  <circle cx="1176" cy="250" r="14" fill="#e8eed6" opacity="0.5"/>
  <circle cx="1160" cy="196" r="7" fill="#e8eed6" opacity="0.45"/>

  <!-- 远山 -->
  <path d="M0 560 L200 420 L360 520 L520 400 L700 540 L860 430 L1040 560 L1240 440 L1420 560 L1600 470 L1600 700 L0 700 Z" fill="#16324a" opacity="0.85"/>
  <path d="M0 600 L180 500 L340 580 L560 470 L760 590 L960 500 L1160 610 L1380 520 L1600 610 L1600 720 L0 720 Z" fill="#1d435f" opacity="0.9"/>

  <!-- 雪地 -->
  <path d="M0 700 Q400 660 800 700 T1600 690 L1600 900 L0 900 Z" fill="url(#snowG)"/>
  <path d="M0 760 Q420 726 820 762 T1600 750 L1600 900 L0 900 Z" fill="#f2f9ff" opacity="0.65"/>
  <path d="M0 836 Q460 806 900 840 T1600 828 L1600 900 L0 900 Z" fill="#ffffff" opacity="0.45"/>

  <!-- 松林 -->
  <g fill="#0c2337" opacity="0.95">
    <path d="M180 700 L215 560 L250 700 Z"/><path d="M180 640 L215 520 L250 640 Z"/>
    <path d="M120 700 L148 600 L176 700 Z"/>
    <path d="M300 700 L340 540 L380 700 Z"/><path d="M300 640 L340 500 L380 640 Z"/><path d="M300 580 L340 470 L380 580 Z"/>
    <path d="M420 700 L452 590 L484 700 Z"/>
    <path d="M1330 700 L1372 530 L1414 700 Z"/><path d="M1330 630 L1372 480 L1414 630 Z"/>
    <path d="M1470 700 L1500 600 L1530 700 Z"/>
    <path d="M1240 700 L1268 610 L1296 700 Z"/>
  </g>

  <!-- 木屋 -->
  <g>
    <rect x="640" y="560" width="210" height="140" fill="#2a1f1a"/>
    <path d="M620 566 L745 470 L870 566 Z" fill="#3a2a22"/>
    <path d="M620 566 L745 470 L870 566 Z" fill="#dff0ff" opacity="0.35"/>
    <rect x="672" y="596" width="58" height="52" fill="url(#warmWin)"/>
    <rect x="762" y="596" width="58" height="52" fill="url(#warmWin)"/>
    <rect x="742" y="648" width="30" height="52" fill="#1a120e"/>
    <rect x="806" y="486" width="16" height="42" fill="#2a1f1a"/>
    <circle cx="814" cy="486" r="16" fill="#cfe6ff" opacity="0.12"/>
    <g stroke="#1a120e" stroke-width="2" opacity="0.8">
      <path d="M672 622 h58"/><path d="M701 596 v52"/><path d="M762 622 h58"/><path d="M791 596 v52"/>
    </g>
  </g>
  <ellipse cx="745" cy="700" rx="300" ry="90" fill="url(#warmGlow)"/>

  <!-- 雪堆与脚印 -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="660" cy="704" rx="120" ry="14"/><ellipse cx="840" cy="708" rx="140" ry="12"/>
  </g>
  <g fill="#a9c6dd" opacity="0.55">
    <ellipse cx="470" cy="800" rx="7" ry="4"/><ellipse cx="512" cy="792" rx="7" ry="4"/>
    <ellipse cx="556" cy="800" rx="7" ry="4"/><ellipse cx="600" cy="792" rx="7" ry="4"/>
    <ellipse cx="644" cy="800" rx="7" ry="4"/>
  </g>

  <!-- 飘雪底纹 -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="90" cy="180" r="3"/><circle cx="240" cy="320" r="2.2"/><circle cx="380" cy="90" r="2.6"/>
    <circle cx="520" cy="260" r="2"/><circle cx="660" cy="380" r="2.8"/><circle cx="800" cy="140" r="2.3"/>
    <circle cx="940" cy="300" r="2.6"/><circle cx="1080" cy="420" r="2"/><circle cx="1220" cy="180" r="2.8"/>
    <circle cx="1360" cy="340" r="2.2"/><circle cx="1500" cy="120" r="2.5"/><circle cx="160" cy="460" r="2"/>
    <circle cx="430" cy="500" r="2.4"/><circle cx="900" cy="520" r="2.1"/><circle cx="1290" cy="520" r="2.4"/>
  </g>

  <radialGradient id="vig3" cx="0.5" cy="0.42" r="0.8">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig3)"/>
</svg>
