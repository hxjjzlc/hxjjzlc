<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title> </title>
<style>
  :root{
    --bg:#0c0503; --ink:#efe3cf; --dim:#8b7a68; --gold:#d9b678; --gold-hi:#ffe7b8; --red:#b3121a;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:16px/1.95 "Noto Serif SC","Songti SC",STSong,serif;letter-spacing:.05em;
    overflow-x:hidden;
  }
  body.pre #article,body.pre #rp,body.pre .bar{display:none!important}
  body.pre{background:#050505}

  /* 背景：暗红晕 + 金尘 */
  #glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 0%,rgba(179,18,26,.30),transparent 70%),
      radial-gradient(50% 40% at 80% 90%,rgba(120,80,20,.16),transparent 70%),
      radial-gradient(40% 35% at 12% 70%,rgba(179,18,26,.12),transparent 70%);
  }
  #rp{position:fixed;inset:0;z-index:40;pointer-events:none}

  .bar{
    position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
    align-items:center;padding:18px 26px;font-size:13px;letter-spacing:.2em;color:var(--dim);
    background:linear-gradient(180deg,rgba(6,4,3,.85),transparent);
  }
  .bar a{color:#cdbfa9;text-decoration:none}
  .bar a:hover{color:var(--gold-hi)}

  #article{position:relative;z-index:10;max-width:720px;margin:0 auto;padding:118px 24px 100px}

  .kicker{
    font-size:11px;letter-spacing:.62em;color:#9a6a48;text-transform:uppercase;margin-bottom:22px;
  }
  h1{
    margin:0 0 16px;font-size:clamp(34px,7vw,54px);font-weight:500;letter-spacing:.16em;line-height:1.25;
    background:linear-gradient(180deg,#fff4dd,#e3bb7d 58%,#a97a3c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .meta{font-size:12.5px;color:#6f6155;letter-spacing:.16em;margin-bottom:46px}
  .meta i{font-style:normal;color:#8a4c34}

  #letter p{margin:0 0 1.55em;color:#e6d9c3;font-size:clamp(15px,1.6vw,16.5px)}
  #letter p:last-child{color:var(--gold-hi);letter-spacing:.3em;font-size:1.06em;margin-top:2.2em}
  .sign{margin-top:8px;font-size:12.5px;color:#7a6a58;letter-spacing:.2em}

  .rule{
    height:1px;margin:52px 0;background:linear-gradient(90deg,transparent,#5a3a1e 22%,#c9a26b 50%,#5a3a1e 78%,transparent);
    opacity:.55
  }

  .cta{text-align:center;margin-top:12px}
  .cta a{
    display:inline-block;padding:14px 34px;border:1px solid #7a4a22;color:var(--gold-hi);text-decoration:none;
    letter-spacing:.34em;font-size:14px;background:linear-gradient(180deg,rgba(179,18,26,.28),rgba(179,18,26,.07));
    transition:.28s
  }
  .cta a:hover{border-color:var(--gold);box-shadow:0 0 40px rgba(201,162,107,.18);transform:translateY(-1px)}
  .cta span{display:block;margin-top:14px;font-size:11.5px;color:#6a5c4e;letter-spacing:.2em}

  #toast{
    position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:60;
    padding:12px 24px;border:1px solid #6b3a1c;background:rgba(20,8,6,.92);color:var(--gold-hi);
    font-size:14px;letter-spacing:.18em;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
    white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

  @media (max-width:560px){
    #article{padding:96px 20px 80px}
    .bar{padding:14px 18px;font-size:12px}
  }
</style>
</head>
<body class="pre">
<div id="glow"></div>

<header class="bar">
  <a href="/">酒精小站</a>
  <span>丁未年 · 正月初一</span>
</header>

<main id="article">
  <div class="kicker">the first day</div>
  <h1>过年好</h1>
  <div class="meta">2027-02-06 &nbsp;·&nbsp; 丁未年正月初一 &nbsp;·&nbsp; <i>红包在掉，点一下试试</i></div>

  <div id="letter"></div>
  <div class="sign">—— 来自一台还在转的服务器</div>

  <div class="rule"></div>

  <div class="cta" id="cta"></div>
</main>

<canvas id="rp"></canvas>
<div id="toast"></div>

<script src="/fx/ny.js"></script>
<script>
(function () {
  'use strict';

  var LETTER = '5aSW6Z2i5aSn5qaC6L+Y5pyJ5Lq65Zyo5pS+54Ku44CC5L2g5Y+v6IO95piv6KKr5ZC16YaS55qE77yM5Lmf5Y+v6IO95piv5qC55pys6L+Y5rKh552h4oCU4oCU5LiN566h5piv5ZOq5LiA56eN77yM5YWI5oqK5omL5py65pS+5L2O5LiA54K577yM6K6p55y8552b5q2H5LiA5Lya5YS/44CCCgrov5nkuIDlubTkuI3nrpfovbvjgILmnInkurrlnKjnrYnkuIDkuKrnrZTlpI3vvIzmnInkurrlnKjnrYnkuIDlvKDljJbpqozljZXvvIzmnInkurrlj6rmmK/nrYnkuIDkuKrkuI3nlKjml6notbfnmoTml6nmmajjgILmiJHkuI3nn6XpgZPkvaDlnKjlk6rkuIDnp43ph4zvvIzkvYbkvaDog73otbDliLDov5nkuKrpobXpnaLvvIzor7TmmI7kvaDoh7PlsJHov5jmnInlipvmsJTmjInlha3kuKrlrZfjgIIKCumCo+Wwsei/meagt+WQp+OAguaEv+S9oOaKiumavui/h+eahOS6i+ivtOW+l+WHuuWPo++8jOaKiumrmOWFtOeahOS6i+iusOW+l+S9j++8m+aEv+S9oOS7iuW5tOWwkeS4gOeCueOAjOWFtuWunuaIkeaXqeWwseefpemBk+OAje+8jOWkmuS4gOeCueOAjOi/mOWlveaIkeayoemUmei/h+OAje+8m+aEv+S9oOi6q+i+ueeahOS6uuS4jeW/heS9oOino+mHiuWkquWkmuWwseiDveaHgu+8jOS5n+aEv+S9oOWBtuWwlOWPr+S7peS4jeino+mHiuOAggoK5paw5bm05b+r5LmQ44CC';

  var body = document.body;
  var N = window.NY || { before: function () { return false; }, open: function () { return true; }, gone: function () { return false; } };

  /* 不到初一：这一页什么都没有 */
  if (N.before()) {
    document.title = ' ';
    body.classList.add('pre');
    return;
  }

  body.classList.remove('pre');
  document.title = '过年好 · 丁未年';
  document.documentElement.style.background = '#0c0503';

  /* 正文（base64，防止顺手翻源码提前看到） */
  var text = '';
  try {
    var bin = atob(LETTER);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    text = new TextDecoder('utf-8').decode(bytes);
  } catch (e) { text = ''; }

  document.getElementById('letter').innerHTML = text
    .split(/\n{2,}/)
    .filter(function (s) { return s.trim(); })
    .map(function (s) { return '<p>' + s.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</p>'; })
    .join('');

  var cta = document.getElementById('cta');
  if (N.open()) {
    cta.innerHTML = '<a href="/card/">写一张贺卡 →</a><span>初一开门，到十五关门</span>';
  } else {
    cta.innerHTML = '<span>门已经关了。明年早点来。</span>';
  }

  /* ---------- 满屏红包 ---------- */
  var cv = document.getElementById('rp');
  var g = cv.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
  var boxes = [], dust = [];

  var WISH = [
    '恭喜发财，利是拿来', '新年快乐，暴富', '今年不许生病', '万事顺遂',
    '红包里没钱，只有祝福', '吃好睡好，别的再说', '少熬夜，多喝水',
    '愿你今年被好好对待', '想做的事都做成了', '该见的人都见到了'
  ];

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function mkBox(seed) {
    var size = 34 + Math.random() * 30;
    return {
      x: Math.random() * W,
      y: seed ? (Math.random() * (H + 160) - 100) : -size * 2,
      w: size, h: size * 1.32,
      vy: 52 + Math.random() * 92,
      vx: (Math.random() - 0.5) * 16,
      rot: (Math.random() - 0.5) * 0.9,
      vr: (Math.random() - 0.5) * 0.7,
      sway: Math.random() * Math.PI * 2,
      sw: 0.6 + Math.random() * 1.2,
      alive: true,
      pop: 0
    };
  }

  for (var b = 0; b < 34; b++) boxes.push(mkBox(true));

  function packet(b) {
    g.save();
    g.globalAlpha *= 0.95;
    g.translate(b.x, b.y);
    g.rotate(b.rot);
    var w = b.w, h = b.h;
    /* 影子 */
    g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 12; g.shadowOffsetY = 4;
    var grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#d8262c'); grd.addColorStop(.55, '#b3121a'); grd.addColorStop(1, '#8a0c12');
    g.fillStyle = grd;
    roundRect(-w / 2, -h / 2, w, h, w * 0.1);
    g.fill();
    g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
    /* 金边 */
    g.strokeStyle = 'rgba(240,205,140,.55)'; g.lineWidth = Math.max(1, w * 0.035);
    roundRect(-w / 2 + w * .08, -h / 2 + h * .1, w * .84, h * .8, w * .08);
    g.stroke();
    /* 封口 */
    g.beginPath();
    g.moveTo(-w * .42, -h * .1);
    g.quadraticCurveTo(0, h * .18, w * .42, -h * .1);
    g.strokeStyle = 'rgba(255,225,170,.5)'; g.stroke();
    /* 福 */
    g.fillStyle = 'rgba(255,232,190,.9)';
    g.font = '600 ' + Math.round(w * .42) + 'px "Noto Serif SC","Songti SC",STSong,serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('福', 0, h * .18);
    g.restore();
  }

  function roundRect(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  var last = performance.now();
  function loop(t) {
    var dt = Math.min(48, t - last) / 1000; last = t;
    g.clearRect(0, 0, W, H);

    for (var i = boxes.length - 1; i >= 0; i--) {
      var b = boxes[i];
      if (b.pop > 0) {
        b.pop -= dt * 2.6;
        if (b.pop <= 0) { boxes.splice(i, 1); continue; }
        g.save(); g.globalAlpha = Math.max(0, b.pop);
        b.w *= 1.02; b.h *= 1.02;
        packet(b); g.restore();
        continue;
      }
      b.y += b.vy * dt;
      b.sway += b.sw * dt;
      b.x += (b.vx + Math.sin(b.sway) * 12) * dt;
      b.rot += b.vr * dt;
      if (b.y - b.h > H + 40) {
        if (boxes.length < 40) { boxes[i] = mkBox(false); }
        else { boxes.splice(i, 1); }
        continue;
      }
      packet(b);
    }

    for (var d = dust.length - 1; d >= 0; d--) {
      var p = dust[d];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt;
      if (p.life <= 0) { dust.splice(d, 1); continue; }
      g.globalAlpha = Math.max(0, p.life / p.max);
      g.fillStyle = p.c;
      g.fillRect(p.x, p.y, p.s, p.s);
      g.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  var toastEl = document.getElementById('toast');
  var toastTimer = 0;
  function toast(s) {
    toastEl.textContent = s;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  document.addEventListener('pointerdown', function (ev) {
    for (var i = boxes.length - 1; i >= 0; i--) {
      var b = boxes[i];
      if (b.pop > 0) continue;
      var dx = Math.abs(ev.clientX - b.x), dy = Math.abs(ev.clientY - b.y);
      if (dx < b.w * 0.9 && dy < b.h * 0.9) {
        b.pop = 1;
        for (var k = 0; k < 16; k++) {
          dust.push({
            x: b.x, y: b.y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.7) * 280,
            s: 2 + Math.random() * 3,
            c: Math.random() < 0.5 ? '#ffd98a' : '#ffffff',
            life: 0.8 + Math.random() * 0.5,
            max: 1.3
          });
        }
        toast(WISH[Math.floor(Math.random() * WISH.length)]);
        break;
      }
    }
  });
})();
</script>
</body>
</html>
